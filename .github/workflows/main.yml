name: Update Weather Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # Run every hour (UTC)

jobs:
  update-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Grants permission to commit and push back to the repository

    steps:
      # Get repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install Python packages
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Run weather uploader & exporter
      - name: Upload weather data & export JSON
        env:
          GCP_KEY: ${{ secrets.GC_SERVICE_KEY_CREDENTIALS }}
        run: |
          python update_weather.py

      # Commit and push updated data.json
      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update BigQuery weather snapshot [skip ci]" || exit 0
          git push